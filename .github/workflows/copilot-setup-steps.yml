name: "Copilot Setup Steps"

# Automatically run the setup steps when they are changed to allow for easy validation, and
# allow manual testing through the repository's "Actions" tab
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/copilot-setup-steps.yml

jobs:
  # The job MUST be called `copilot-setup-steps` or it will not be picked up by Copilot.
  copilot-setup-steps:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Set the permissions to the lowest permissions possible needed for your steps.
    # Copilot will be given its own token for its operations.
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Restore CI tool cache
        id: ci-tools-cache
        uses: actions/cache/restore@v4
        with:
          path: .github/ci-tools/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-ci-tools-${{ hashFiles('.github/ci-tools/package-lock.json') }}

      - name: Install Azure Functions Core Tools and Azurite
        if: steps.ci-tools-cache.outputs.cache-hit != 'true'
        shell: bash
        working-directory: .github/ci-tools
        run: |
          last_status=1
          for attempt in 1 2 3; do
            if [ "$attempt" -eq 1 ]; then
              echo "Attempt 1/3: initial npm ci"
            else
              echo "Attempt ${attempt}/3: retry after npm ci exited with code ${last_status}"
              rm -rf node_modules
              if [ "$attempt" -eq 2 ]; then
                sleep 10
              else
                sleep 30
              fi
            fi
            if npm ci; then
              exit 0
            else
              last_status=$?
              echo "Attempt ${attempt}/3 failed: npm ci exited with code ${last_status}"
            fi
          done
          exit "$last_status"

      - name: Add CI tools to PATH
        shell: bash
        run: echo "$GITHUB_WORKSPACE/.github/ci-tools/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Save CI tool cache
        if: success() && steps.ci-tools-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .github/ci-tools/node_modules
          key: ${{ runner.os }}-${{ runner.arch }}-ci-tools-${{ hashFiles('.github/ci-tools/package-lock.json') }}

      - name: Restore .NET dependencies
        run: dotnet restore BlazorSwaStarter.sln

      - name: Build .NET solution
        run: dotnet build BlazorSwaStarter.sln --no-restore --configuration Release

      - name: Install test dependencies
        working-directory: tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install --with-deps chromium
