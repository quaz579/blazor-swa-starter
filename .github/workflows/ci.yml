name: CI

# workflow_dispatch is mandatory: the very first push to a freshly-cloned repo
# happens before `terraform apply` has created AZURE_STATIC_WEB_APPS_API_TOKEN,
# so that first run is red by construction and needs a manual re-run once the
# secret exists.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-build-test:
    if: >-
      !cancelled() && (true) && (vars.RUNNER_PROFILE == 'org-app' && github.repository_owner == 'bengrossmandotus' && github.event.repository.private == true && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))) && vars.RUNNER_MODE != 'hosted' && vars.RUNNER_FALLBACK_ENABLED == 'true')
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions: {}
    outputs:
      labels: ${{ steps.select.outputs.labels }}
    steps:
      - id: select
        shell: bash
        env:
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: &org-app-selector |
          set -euo pipefail
          hosted() {
            printf 'labels=["ubuntu-latest"]\n' >> "$GITHUB_OUTPUT"
            printf 'selected hosted: %s\n' "$1"
          }
          if [ -z "${RUNNER_STATUS_TOKEN:-}" ]; then
            hosted 'status credential unavailable'
            exit 0
          fi
          endpoint="https://api.github.com/orgs/bengrossmandotus/actions/runners"
          response="$(mktemp)"
          trap 'rm -f "$response"' EXIT
          found=false
          for page in $(seq 1 10); do
            if ! status="$(printf 'Authorization: Bearer %s\n' "$RUNNER_STATUS_TOKEN" | curl -sS \
              --connect-timeout 3 --max-time 5 -H @- \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -o "$response" -w '%{http_code}' \
              "$endpoint?per_page=100&page=$page" 2>/dev/null)"; then
              hosted 'status transport failure or timeout'
              exit 0
            fi
            if [ "$status" != 200 ]; then
              hosted 'status API rejected the request'
              exit 0
            fi
            if ! jq -e '
              type == "object" and (.total_count | type == "number" and . >= 0 and . == floor)
              and (.runners | type == "array" and length <= 100)
              and (.total_count >= (.runners | length))
              and all(.runners[];
                (.name | type == "string") and (.status | type == "string")
                and (.busy | type == "boolean") and (.labels | type == "array")
                and all(.labels[]; .name | type == "string"))
            ' "$response" >/dev/null 2>&1; then
              hosted 'invalid runner inventory'
              exit 0
            fi
            if jq -e 'any(.runners[];
              .name == "factory-apps-1" and .status == "online" and .busy == false
              and ([.labels[].name] | contains(["self-hosted","Linux","X64","factory-apps"])))
            ' "$response" >/dev/null; then
              found=true
            fi
            count="$(jq '.runners | length' "$response")"
            total="$(jq '.total_count' "$response")"
            if [ "$count" -lt 100 ] && [ "$(( (page - 1) * 100 + count ))" -lt "$total" ]; then
              hosted 'incomplete runner inventory'
              exit 0
            fi
            if [ "$(( page * 100 ))" -ge "$total" ]; then
              if [ "$found" = true ]; then
                printf 'labels=["self-hosted","Linux","X64","factory-apps"]\n' >> "$GITHUB_OUTPUT"
                echo 'selected nuc: app listener online and idle'
              else
                hosted 'app listener unavailable or busy'
              fi
              exit 0
            fi
          done
          hosted 'runner inventory pagination limit'

  build-test:
    needs: [select-build-test]
    if: >-
      !cancelled() && (true) && (needs.select-build-test.result == 'success' || (needs.select-build-test.result == 'skipped' && !(vars.RUNNER_PROFILE == 'org-app' && github.repository_owner == 'bengrossmandotus' && github.event.repository.private == true && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))) && vars.RUNNER_MODE != 'hosted' && vars.RUNNER_FALLBACK_ENABLED == 'true')))
    runs-on: ${{ fromJSON((vars.RUNNER_PROFILE == 'org-app' && github.repository_owner == 'bengrossmandotus' && github.event.repository.private == true && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)))) && vars.RUNNER_MODE != 'hosted' && (vars.RUNNER_FALLBACK_ENABLED != 'true' && '["self-hosted","Linux","X64","factory-apps"]' || needs.select-build-test.outputs.labels) || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Check generated agent views
        run: scripts/generate-agent-views.sh --check

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore BlazorSwaStarter.sln

      - name: Build
        run: dotnet build BlazorSwaStarter.sln -c Release --no-restore

      - name: Test
        run: >
          dotnet test BlazorSwaStarter.sln -c Release --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

  select-e2e:
    needs: [build-test]
    if: >-
      !cancelled() && (true) && (vars.RUNNER_PROFILE == 'org-app' && github.repository_owner == 'bengrossmandotus' && github.event.repository.private == true && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))) && vars.RUNNER_MODE != 'hosted' && vars.RUNNER_FALLBACK_ENABLED == 'true') && needs.build-test.result == 'success'
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions: {}
    outputs:
      labels: ${{ steps.select.outputs.labels }}
    steps:
      - id: select
        shell: bash
        env:
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: *org-app-selector

  e2e:
    needs: [build-test, select-e2e]
    if: >-
      !cancelled() && (true) && needs.build-test.result == 'success' && (needs.select-e2e.result == 'success' || (needs.select-e2e.result == 'skipped' && !(vars.RUNNER_PROFILE == 'org-app' && github.repository_owner == 'bengrossmandotus' && github.event.repository.private == true && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))) && vars.RUNNER_MODE != 'hosted' && vars.RUNNER_FALLBACK_ENABLED == 'true')))
    runs-on: ${{ fromJSON((vars.RUNNER_PROFILE == 'org-app' && github.repository_owner == 'bengrossmandotus' && github.event.repository.private == true && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)))) && vars.RUNNER_MODE != 'hosted' && (vars.RUNNER_FALLBACK_ENABLED != 'true' && '["self-hosted","Linux","X64","factory-apps"]' || needs.select-e2e.outputs.labels) || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install Azure Functions Core Tools and SWA CLI
        # azurite pinned here (matching scripts/start-e2e.sh's fallback version)
        # so start-e2e.sh finds it on PATH instead of cold-downloading via npx,
        # which was blowing past the readiness window on a cold runner.
        run: npm install -g azure-functions-core-tools@4 @azure/static-web-apps-cli azurite@3.37.0

      - name: Install Playwright test dependencies
        working-directory: tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps ' || '' }}chromium

      # start-e2e.sh gives `func start` and `dotnet run` a bounded readiness
      # window, and both build before they listen. This runner never built, so
      # building up front keeps those in-script builds incremental.
      - name: Build solution
        run: dotnet build BlazorSwaStarter.sln -c Release

      - name: Start E2E environment
        run: ./scripts/start-e2e.sh

      - name: Run Playwright suite
        working-directory: tests
        env:
          CI: "true"
        # playwright.config.ts derives the base URL from scripts/ports.env
        # (tests/helpers/ports.ts) — no port is hardcoded here.
        run: npm test

      - name: Stop E2E environment
        if: always()
        run: ./scripts/stop-e2e.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: tests/playwright-report/
          retention-days: 7

  select-e2e-poc-auth:
    needs: [build-test, e2e]
    if: >-
      !cancelled() && (true) && (vars.RUNNER_PROFILE == 'org-app' && github.repository_owner == 'bengrossmandotus' && github.event.repository.private == true && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))) && vars.RUNNER_MODE != 'hosted' && vars.RUNNER_FALLBACK_ENABLED == 'true') && needs.build-test.result == 'success' && needs.e2e.result == 'success'
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions: {}
    outputs:
      labels: ${{ steps.select.outputs.labels }}
    steps:
      - id: select
        shell: bash
        env:
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: *org-app-selector

  e2e-poc-auth:
    needs: [build-test, select-e2e-poc-auth]
    if: >-
      !cancelled() && (true) && needs.build-test.result == 'success' && (needs.select-e2e-poc-auth.result == 'success' || (needs.select-e2e-poc-auth.result == 'skipped' && !(vars.RUNNER_PROFILE == 'org-app' && github.repository_owner == 'bengrossmandotus' && github.event.repository.private == true && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))) && vars.RUNNER_MODE != 'hosted' && vars.RUNNER_FALLBACK_ENABLED == 'true')))
    runs-on: ${{ fromJSON((vars.RUNNER_PROFILE == 'org-app' && github.repository_owner == 'bengrossmandotus' && github.event.repository.private == true && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)))) && vars.RUNNER_MODE != 'hosted' && (vars.RUNNER_FALLBACK_ENABLED != 'true' && '["self-hosted","Linux","X64","factory-apps"]' || needs.select-e2e-poc-auth.outputs.labels) || '["ubuntu-latest"]') }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install Azure Functions Core Tools and SWA CLI
        run: npm install -g azure-functions-core-tools@4 @azure/static-web-apps-cli azurite@3.37.0

      - name: Install Playwright test dependencies
        working-directory: tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps ' || '' }}chromium

      - name: Enable POC auth
        run: node scripts/enable-poc-auth.mjs

      - name: Build solution
        run: dotnet build BlazorSwaStarter.sln -c Release

      - name: Start E2E environment
        run: ./scripts/start-e2e.sh

      - name: Run POC auth specs
        working-directory: tests
        env:
          CI: "true"
        run: npx playwright test specs/poc-auth.spec.ts specs/change-password.spec.ts

      - name: Stop E2E environment
        if: always()
        run: ./scripts/stop-e2e.sh

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-poc-auth
          path: |
            tests/playwright-report/
            tests/test-results/
          retention-days: 7

  select-deploy:
    needs: [e2e, e2e-poc-auth]
    if: >-
      !cancelled() && (true) && (vars.RUNNER_PROFILE == 'org-app' && github.repository_owner == 'bengrossmandotus' && github.event.repository.private == true && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))) && vars.RUNNER_MODE != 'hosted' && vars.RUNNER_FALLBACK_ENABLED == 'true') && needs.e2e.result == 'success' && needs.e2e-poc-auth.result == 'success'
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions: {}
    outputs:
      labels: ${{ steps.select.outputs.labels }}
    steps:
      - id: select
        shell: bash
        env:
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: *org-app-selector

  deploy:
    needs: [e2e, e2e-poc-auth, select-deploy]
    if: >-
      !cancelled() && (true) && needs.e2e.result == 'success' && needs.e2e-poc-auth.result == 'success' && (needs.select-deploy.result == 'success' || (needs.select-deploy.result == 'skipped' && !(vars.RUNNER_PROFILE == 'org-app' && github.repository_owner == 'bengrossmandotus' && github.event.repository.private == true && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))) && vars.RUNNER_MODE != 'hosted' && vars.RUNNER_FALLBACK_ENABLED == 'true')))
    runs-on: ${{ fromJSON((vars.RUNNER_PROFILE == 'org-app' && github.repository_owner == 'bengrossmandotus' && github.event.repository.private == true && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)))) && vars.RUNNER_MODE != 'hosted' && (vars.RUNNER_FALLBACK_ENABLED != 'true' && '["self-hosted","Linux","X64","factory-apps"]' || needs.select-deploy.outputs.labels) || '["ubuntu-latest"]') }}
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    outputs:
      preview_url: ${{ steps.deploy.outputs.static_web_app_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          lfs: false

      - name: Build and deploy
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: src/App.Web
          api_location: src/App.Api
          output_location: wwwroot
          # Oryx builds net9.0 server-side for both the frontend and the
          # managed-functions API — do not set skip_app_build/skip_api_build.

      - name: Check whether the pull request closed during the run
        id: pr-state
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          state="$(gh pr view ${{ github.event.pull_request.number }} --repo "$GITHUB_REPOSITORY" --json state --jq .state)"
          echo "state=$state" >> "$GITHUB_OUTPUT"

      # pr-cleanup.yml only fires once, at close. A run still deploying (or re-run)
      # after that would otherwise recreate the preview environment and leak a slot.
      - name: Close the preview environment of an already-closed pull request
        if: github.event_name == 'pull_request' && steps.pr-state.outputs.state != 'OPEN'
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: close

  select-smoke-preview:
    needs: [deploy]
    if: >-
      !cancelled() && (github.event_name == 'pull_request') && (vars.RUNNER_PROFILE == 'org-app' && github.repository_owner == 'bengrossmandotus' && github.event.repository.private == true && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))) && vars.RUNNER_MODE != 'hosted' && vars.RUNNER_FALLBACK_ENABLED == 'true') && needs.deploy.result == 'success'
    runs-on: ubuntu-slim
    timeout-minutes: 2
    permissions: {}
    outputs:
      labels: ${{ steps.select.outputs.labels }}
    steps:
      - id: select
        shell: bash
        env:
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
        run: *org-app-selector

  smoke-preview:
    needs: [deploy, select-smoke-preview]
    if: >-
      !cancelled() && (github.event_name == 'pull_request') && needs.deploy.result == 'success' && (needs.select-smoke-preview.result == 'success' || (needs.select-smoke-preview.result == 'skipped' && !(vars.RUNNER_PROFILE == 'org-app' && github.repository_owner == 'bengrossmandotus' && github.event.repository.private == true && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association))) && vars.RUNNER_MODE != 'hosted' && vars.RUNNER_FALLBACK_ENABLED == 'true')))
    runs-on: ${{ fromJSON((vars.RUNNER_PROFILE == 'org-app' && github.repository_owner == 'bengrossmandotus' && github.event.repository.private == true && (github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.pull_request.author_association)))) && vars.RUNNER_MODE != 'hosted' && (vars.RUNNER_FALLBACK_ENABLED != 'true' && '["self-hosted","Linux","X64","factory-apps"]' || needs.select-smoke-preview.outputs.labels) || '["ubuntu-latest"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tests/package-lock.json

      - name: Install Playwright test dependencies
        working-directory: tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: tests
        run: npx playwright install ${{ runner.environment == 'github-hosted' && '--with-deps ' || '' }}chromium

      - name: Wait for preview environment to come online
        run: |
          url="${{ needs.deploy.outputs.preview_url }}"
          for _ in $(seq 1 60); do
            if curl -sf -o /dev/null "$url"; then
              echo "Preview is up: $url"
              exit 0
            fi
            sleep 2
          done
          echo "Preview never responded at $url" >&2
          exit 1

      # Preview environments inherit production app settings and therefore
      # production storage — never run a write path against one. Only the
      # @smoke subset runs here: read-only, except poc-auth.spec.ts, which is
      # skipped unless POC auth is enabled and then signs in as the fixture
      # user only, writing nothing but that user's session row and logging
      # out after every test.
      - name: Run smoke tests against preview
        working-directory: tests
        env:
          CI: "true"
          BASE_URL: ${{ needs.deploy.outputs.preview_url }}
        run: npx playwright test --grep @smoke
